<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bem Aqui Imóveis">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A4578"/>
      <stop offset="100%" stop-color="#15233F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C85A"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <!-- Soft glow -->
  <circle cx="46" cy="18" r="16" fill="#F0C85A" opacity="0.14"/>

  <!-- Building silhouette behind monogram -->
  <g fill="#0E1A30" opacity="0.55">
    <rect x="38" y="28" width="10" height="24" rx="1"/>
    <rect x="49" y="22" width="8" height="30" rx="1"/>
    <rect x="42" y="18" width="2" height="4" rx="1"/>
  </g>
  <g fill="#F0C85A" opacity="0.85">
    <rect x="40.5" y="31" width="2" height="2" rx="0.3"/>
    <rect x="44" y="31" width="2" height="2" rx="0.3"/>
    <rect x="40.5" y="36" width="2" height="2" rx="0.3"/>
    <rect x="44" y="36" width="2" height="2" rx="0.3"/>
    <rect x="40.5" y="41" width="2" height="2" rx="0.3"/>
    <rect x="44" y="41" width="2" height="2" rx="0.3"/>
    <rect x="51" y="26" width="1.8" height="1.8" rx="0.3"/>
    <rect x="54.2" y="26" width="1.8" height="1.8" rx="0.3"/>
    <rect x="51" y="31" width="1.8" height="1.8" rx="0.3"/>
    <rect x="54.2" y="31" width="1.8" height="1.8" rx="0.3"/>
    <rect x="51" y="36" width="1.8" height="1.8" rx="0.3"/>
    <rect x="54.2" y="36" width="1.8" height="1.8" rx="0.3"/>
    <rect x="51" y="41" width="1.8" height="1.8" rx="0.3"/>
    <rect x="54.2" y="41" width="1.8" height="1.8" rx="0.3"/>
  </g>

  <!-- BA monogram -->
  <text
    x="28"
    y="42"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="700"
    fill="url(#gold)"
    letter-spacing="-1"
  >BA</text>

  <!-- Ground accent -->
  <rect x="10" y="52" width="44" height="2.5" rx="1.25" fill="url(#gold)" opacity="0.9"/>
</svg>
